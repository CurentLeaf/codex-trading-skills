name: Import upstream skills

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_upstream.py'
      - '.github/workflows/import-upstream.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import upstream repository
        run: python scripts/sync_upstream.py
      - name: Commit imported skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills workflows skillsets skills-index.yaml upstream
          if ! git diff --cached --quiet; then
            git commit -m "Import Codex-compatible trading skills from upstream"
            git push
          fi
